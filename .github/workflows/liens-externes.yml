# LES LIENS VERS LES SOURCES OFFICIELLES, VÉRIFIÉS CHAQUE SEMAINE.
#
# Pourquoi ici et pas dans le build : Légifrance et plusieurs sites publics
# répondent 403 à une machine de développement (protection anti-robot), et le
# proxy en bloque d'autres. Un contrôle qui ne distingue pas « mort » de
# « bloqué » ment. GitHub, lui, n'est pas bloqué.
#
# Pourquoi pas dans `npm run build` : un lien d'une administration qui tombe un
# matin n'a pas à empêcher un déploiement. Il doit être signalé, pas bloquant.
#
# Ce qu'il faut faire : RIEN. Il tourne tout seul le lundi matin et ouvre une
# issue s'il trouve un lien mort. Pour le lancer à la main, ouvrir l'onglet
# « Actions » du dépôt sur GitHub, choisir « Liens externes » puis
# « Run workflow » — aucun terminal.

name: Liens externes

on:
  schedule:
    # Le lundi à 7 h 09 UTC. Minute décalée : les tâches planifiées à l'heure
    # ronde s'entassent et partent en retard.
    - cron: "9 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Vérifier les liens des sources officielles
        id: verif
        run: |
          set +e
          node scripts/verif-liens-externes.mjs https://www.timat.app 2>&1 | tee /tmp/liens.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Ouvrir une issue si un lien est mort
        if: steps.verif.outputs.code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const rapport = fs.readFileSync("/tmp/liens.txt", "utf8").slice(0, 60000);
            const titre = "Lien mort vers une source officielle";
            // Une seule issue ouverte à la fois : on commente celle qui existe
            // plutôt que d'en empiler une par semaine.
            const { data: ouvertes } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "liens",
            });
            const corps = [
              "Un ou plusieurs liens cités par le blog ne répondent plus.",
              "",
              "Un lien n'est déclaré mort que si trois essais espacés donnent la même réponse :",
              "un 404 isolé peut venir d'une limitation de débit, pas d'une page retirée.",
              "",
              "```",
              rapport,
              "```",
              "",
              "_Vérification hebdomadaire des liens externes._",
            ].join("\n");
            if (ouvertes.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: ouvertes[0].number, body: corps,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: titre, body: corps, labels: ["liens"],
              });
            }
